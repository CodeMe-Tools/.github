name: CI - .github

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Organization Governance & Health Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Key Governance Files
        run: |
          test -f profile/README.md
          test -f profile/assets/codeme-logo.svg
          test -f profile/assets/codeme-banner.svg
          test -f .github/PULL_REQUEST_TEMPLATE.md
          echo "All organization health files verified."
