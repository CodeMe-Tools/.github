<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.12" />
    </pattern>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1096" height="276" rx="20" fill="url(#bannerBg)" stroke="url(#bannerBorder)" stroke-width="2" />
  
  <!-- Dot Grid Pattern -->
  <rect x="2" y="2" width="1096" height="276" rx="20" fill="url(#dotGrid)" />

  <!-- Ambient Glow Effects -->
  <rect x="2" y="2" width="1096" height="276" rx="20" fill="url(#glowCyan)" />
  <rect x="2" y="2" width="1096" height="276" rx="20" fill="url(#glowIndigo)" />

  <!-- Left Logo Icon Card -->
  <g transform="translate(56, 44)">
    <rect width="180" height="180" rx="36" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="2.5" filter="drop-shadow(0 12px 28px rgba(14,165,233,0.3))" />
    
    <!-- Code Brackets -->
    <path d="M 46 68 L 30 90 L 46 112" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M 134 68 L 150 90 L 134 112" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

    <!-- Lightning Bolt -->
    <path d="M 102 38 L 65 92 L 92 92 L 82 144 L 124 86 L 98 86 Z" fill="url(#boltGrad)" filter="url(#softGlow)" />
  </g>

  <!-- Title & Typography -->
  <g transform="translate(270, 72)">
    <!-- Brand Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="4" fill="url(#titleGrad)">
      CODEME<tspan fill="#38bdf8">.TOOLS</tspan>
    </text>

    <!-- Version Badge -->
    <rect x="424" y="16" width="76" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5" />
    <text x="462" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc" text-anchor="middle">v0.1.0</text>

    <!-- Tagline -->
    <text x="2" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#94a3b8">
      AUTONOMOUS CODE QUALITY, VERIFICATION &amp; INVARIANT PLATFORM
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 114)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Silent-Success (Exit 0)</text>

      <!-- Pill 2 -->
      <rect x="188" y="0" width="186" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="204" cy="16" r="4.5" fill="#38bdf8" />
      <text x="216" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Ed25519 Cryptography</text>

      <!-- Pill 3 -->
      <rect x="386" y="0" width="186" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="402" cy="16" r="4.5" fill="#a855f7" />
      <text x="414" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">macOS • Linux • Windows</text>

      <!-- Pill 4 -->
      <rect x="584" y="0" width="168" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="600" cy="16" r="4.5" fill="#f59e0b" />
      <text x="612" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Native Agent Skills</text>
    </g>
  </g>
</svg>